<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dynova inspector</title>
  <style>
    body { margin: 0; background: #11141a; color: #d8dee9; font: 13px system-ui, sans-serif; }
    #layout { display: flex; gap: 12px; padding: 12px; align-items: flex-start; height: calc(100vh - 24px); box-sizing: border-box; }
    canvas { background: #1b1f27; border: 1px solid #333b4a; border-radius: 6px; }
    #panel { height: 100%; }
    #note { padding: 0 12px; color: #7d8799; }
  </style>
</head>
<body>
  <div id="note">A box and sphere pile on the left; the inspector on the right reads the same shared memory and never writes to it.</div>
  <div id="layout">
    <canvas id="view" width="640" height="420"></canvas>
    <div id="panel"></div>
  </div>
  <script type="module" src="./inspector.ts"></script>
</body>
</html>
