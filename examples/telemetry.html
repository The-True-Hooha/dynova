<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dynova telemetry twin</title>
  <style>
    body { margin: 0; background: #11141a; color: #d8dee9; font: 13px system-ui, sans-serif; }
    #layout { display: flex; gap: 12px; padding: 12px; align-items: flex-start; height: calc(100vh - 56px); box-sizing: border-box; }
    canvas { background: #1b1f27; border: 1px solid #333b4a; border-radius: 6px; }
    #panel { height: 100%; }
    #note { padding: 8px 12px 0; color: #7d8799; }
  </style>
</head>
<body>
  <div id="note">Tracked entities follow a recorded telemetry stream (a sample every 12 ticks). Green lines are each entity's velocity, read from the inspector snapshot. Record, pause and scrub in the panel: a seek replays the stream bit-identically.</div>
  <div id="layout">
    <canvas id="view" width="880" height="640"></canvas>
    <div id="panel"></div>
  </div>
  <script type="module" src="./telemetry.ts"></script>
</body>
</html>
